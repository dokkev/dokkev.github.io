<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Proposed HIL testbed: data, models and evaluation</title>
  <desc id="desc">One proposed physical tendon testbed, comprising QDD motor, cable and emulation motor, exchanges measured force and commanded motion with a MuJoCo 2-DoF finger. Before hardware implementation a numerical tendon substitutes for the physical transmission to verify the same architecture. Testbed and MuJoCo states form disjoint training, validation and test datasets. System identification and model comparison inform neural observer training. Fitted models and motor-only predictions enter held-out evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1e293b}
      .head{font-size:17px;font-weight:600}.sub{font-size:14px;fill:#475569}.label{font-size:12px;fill:#64748b}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.2;rx:3}.state{fill:#f8fafc}
      .edge{fill:none;stroke:#475569;stroke-width:1.4;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="620" fill="#fff"/>
  <rect class="box state" x="30" y="30" width="390" height="125"/>
  <text class="head" x="225" y="61" text-anchor="middle">Physical Transmission Testbed</text>
  <text class="sub" x="225" y="87" text-anchor="middle">QDD · tendon · emulation motor</text>
  <text class="sub" x="225" y="111" text-anchor="middle">Separate T_in / T_out sensing</text>
  <text class="label" x="225" y="137" text-anchor="middle">Proposed HIL; numerical tendon substitutes for verification</text>
  <rect class="box state" x="540" y="30" width="390" height="125"/>
  <text class="head" x="735" y="61" text-anchor="middle">MuJoCo 2-DoF Finger</text>
  <text class="sub" x="735" y="87" text-anchor="middle">Dynamics · passive mechanics · contact</text>
  <text class="sub" x="735" y="111" text-anchor="middle">Virtual configuration and tendon geometry</text>
  <text class="label" x="735" y="137" text-anchor="middle">Finger configuration ≠ physical routing</text>
  <path class="edge" d="M420 76 H540"/>
  <text class="label" x="480" y="65" text-anchor="middle">T_out</text>
  <path class="edge" d="M540 121 H420"/>
  <text class="label" x="480" y="144" text-anchor="middle">Δℓ(q)</text>
  <path class="edge" d="M225 155 V185 H165 V220"/>
  <path class="edge" d="M735 155 V185 H480 V220"/>
  <rect class="box" x="30" y="220" width="585" height="76"/>
  <text class="head" x="322" y="250" text-anchor="middle">Synchronized Long-Horizon Dataset</text>
  <text class="sub" x="322" y="276" text-anchor="middle">S_MJ + S_TB · disjoint train / validation / test runs</text>
  <rect class="box state" x="660" y="220" width="270" height="76"/>
  <text class="head" x="795" y="250" text-anchor="middle">Deployed Finger State</text>
  <text class="sub" x="795" y="276" text-anchor="middle">QDD motor observations only</text>
  <path class="edge" d="M165 296 V370"/>
  <path class="edge" d="M480 296 V370"/>
  <path class="edge" d="M795 296 V370"/>
  <text class="label" x="322" y="331" text-anchor="middle">Train / validation</text>
  <rect class="box" x="30" y="370" width="270" height="76"/>
  <text class="head" x="165" y="400" text-anchor="middle">System ID + Model Comparison</text>
  <text class="sub" x="165" y="426" text-anchor="middle">Physics · hybrid · learned</text>
  <rect class="box" x="345" y="370" width="270" height="76"/>
  <text class="head" x="480" y="400" text-anchor="middle">Neural Observer Training</text>
  <text class="sub" x="480" y="426" text-anchor="middle">State + evolving mechanics</text>
  <path class="edge" d="M300 405 H345"/>
  <rect class="box" x="660" y="370" width="270" height="76"/>
  <text class="head" x="795" y="400" text-anchor="middle">Motor-Only Inference</text>
  <text class="sub" x="795" y="426" text-anchor="middle">State + mechanics estimates</text>
  <path class="edge dash" d="M615 405 H660"/>
  <text class="label" x="637" y="391" text-anchor="middle">η</text>
  <path class="edge" d="M165 446 V530"/>
  <path class="edge" d="M795 446 V530"/>
  <path class="edge" d="M615 285 H645 V530"/>
  <text class="label" x="655" y="498">Test runs</text>
  <rect class="box state" x="30" y="530" width="900" height="70"/>
  <text class="head" x="480" y="559" text-anchor="middle">Held-Out Evaluation</text>
  <text class="sub" x="480" y="585" text-anchor="middle">Model fidelity · mechanics drift · observability · contact-force error</text>
</svg>
